<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No Account Found</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="center">
  <p class="big">🚫</p>
  <h1>Error: account not found</h1>
  <p id="msg" class="sub">There's no Instagram account with this username.</p>
  <p><code id="name"></code></p>
  <div class="actions">
    <a class="btn" href="/"><button class="primary">Back to generator</button></a>
  </div>
</main>
<script>
  const p = new URLSearchParams(location.search);
  document.getElementById('name').textContent = '@' + (p.get('u') || '');
  if (p.get('reason') === 'invalid') {
    document.getElementById('msg').textContent = "That isn't a valid Instagram username.";
  } else {
    document.getElementById('msg').textContent = "There's no Instagram account with this username, so it may be available to claim.";
  }
</script>
</body>
</html>
