app = "claude-z1b5uq"
primary_region = "iad"

[build]

[deploy]
  release_command = "node dist/db/migrate.js"

[processes]
  web = "node dist/index.js"
  worker = "node dist/worker.js"

[env]
  PORT = "8080"
  STUDY_MINUTES = "4"
  MIN_STUDY_MINUTES_BEFORE_SPEECH = "3"
  SPEECH_MIN_SECONDS = "60"
  SPEECH_MAX_SECONDS = "120"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  processes = ["web"]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[vm]]
  processes = ["worker"]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
